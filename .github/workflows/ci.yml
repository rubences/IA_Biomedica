name: Notebook QA

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate notebook
        run: python scripts/validate_notebook.py

      - name: Ensure dataset is not committed
        shell: bash
        run: |
          if git ls-files | grep -Ei '(^|/)(Malaria Data\.zip|Malaria/|data/extracted/)'; then
            echo "ERROR: el dataset no debe versionarse."
            exit 1
          fi
          echo "OK: dataset no versionado."
