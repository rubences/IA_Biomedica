name: Notebook QA

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate notebook
        run: python scripts/validate_notebook.py

      - name: Ensure dataset is not committed
        shell: bash
        run: |
          if git ls-files | grep -Ei '(^|/)(Malaria Data\.zip|Malaria/|data/extracted/)'; then
            echo "ERROR: el dataset no debe versionarse."
            exit 1
          fi
          echo "OK: dataset no versionado."

      - name: Ensure group control sheet is not public
        shell: bash
        run: |
          if git ls-files | grep -Ei 'hoja de control.*\.docx$'; then
            echo "ERROR: la hoja de control grupal no debe publicarse en el repositorio."
            exit 1
          fi
          echo "OK: hoja de control fuera del repositorio."

      - name: Ensure one canonical deliverable notebook
        shell: bash
        run: |
          notebooks=$(git ls-files '*.ipynb' | wc -l | tr -d ' ')
          if [ "$notebooks" -ne 1 ]; then
            echo "ERROR: debe existir un único notebook de entrega; encontrados: $notebooks"
            git ls-files '*.ipynb'
            exit 1
          fi
          test "$(git ls-files '*.ipynb')" = "MUBIO07_Actividad3_IA_Python_Grupo.ipynb"
          echo "OK: único notebook canónico de entrega."
